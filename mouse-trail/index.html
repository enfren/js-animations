<!DOCTYPE html>
<html>
<head><title>Mouse Trail</title></head>
<body style="margin:0;background:#000;overflow:hidden;cursor:crosshair">
<canvas id="c" style="display:block"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
c.width = innerWidth;
c.height = innerHeight;

let particles = [];
let mx = 0, my = 0;

addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

function loop() {
  // Fade previous frame (creates trail effect)
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.fillRect(0, 0, c.width, c.height);

  // Spawn 3 particles at cursor
  for (let i = 0; i < 3; i++) {
    particles.push({
      x: mx + (Math.random() - 0.5) * 10,
      y: my + (Math.random() - 0.5) * 10,
      vx: (Math.random() - 0.5) * 3,
      vy: (Math.random() - 0.5) * 3,
      life: 1
    });
  }

  // Update & draw
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.02;
    if (p.life <= 0) { particles.splice(i, 1); continue; }

    ctx.fillStyle = `hsla(${p.x}, 80%, 60%, ${p.life})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.life * 6, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
